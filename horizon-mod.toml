id = "evilcraft"
name = "EvilCraft"
version = "0.2.12"
description = """A port of EvilCraft's blood economy for Horizon: the Blood Extractor fills with
the blood of a mob its carrier kills (floor(hp x 5) to floor(hp x 40) mB), a mob that dies from
fall damage leaves a Blood Stain holding 20 mB for each point of its max health, a crouching
right-click drains a Blood Stain's five buckets into it or pours a filled extractor into a Dark
Tank's sixteen, the Blood Infuser spends that blood infusing an item into another (a bone into a
blaze rod, a book into a Blook, and the mod's own recipes as data), and the Blood Chest spends it
to repair the ten damaged items in its slots, one damage point every two ticks for 5 mB, with a
broken anvil stepping back to a whole one for 125 mB. The Colossal Blood Chest is the same
machine at the size of a hollow 3x3x3 shell of Reinforced Undead Planks: 45 repair slots, and no
repair while the shell is open. The Purifier is its three-bucket counterpart for tools: a click
puts an item in its purge slot, and sixty ticks and one bucket of blood strip a curse from it —
except from the Vengeance Pickaxe, whose own curse is immune to that action. All five blocks keep
their blood when broken: the dropped item carries the tank, and placing it again fills the block
back, clamped to its own capacity."""
authors = ["rubensworks (kroeser)", "AdLf0208"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside data/ and assets/. The id is the resource namespace and the only identity.
api = "0.2"
# An integrated server belongs to the client installation, so a LAN host and single
# player need both sides; the two machines' screens are the client half.
side = "both"
# "May add blocks, items, mob effects and entity types to your worlds": the chest and infuser
# blocks, the extractor and the tier promises, their block entities and menu types, the two
# machines' recipe type and the creative tab.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
