[mod]
id = "evilcraft"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "1d63e0a5a37a7a708eb0b32b49bf0dfeb28ed8a9"

# The pure blood arithmetic (standalone crate lib, injected as
# `crate::game::evilcraft`): the kill's blood, the repair step, the anvil step,
# the tank and container moves.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "evilcraft"
source = "runtime.rs"

# Game-side glue: the blood chest's tank and slots, the extractor's blood, the
# kill cache, the screen, the commands.
[[module]]
id = "state"
file = "crates/horizon-client/src/game.rs"
name = "evilcraft_state"
source = "support.rs"

# The content half is inside this bundle (`data/evilcraft-content.hmod`, the built
# `content/evilcraft.hmod`): this writes it to `.horizon-cache/` and appends it to the
# dev-mod list, so one `.hnmod` installs the block, the item and the code. The registry
# keeps one file per project, so a split port could not be listed; AE2 ships the same
# pattern (`docs/native-mods.md`, "A bundle").
[[injection]]
id = "embedded-content"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::mods::content_root"
helper = "embedded_content.rs"
bindings = [
  { name = "root", ty = "&std::path::Path", value = "root" },
  { name = "enabled", ty = "&std::collections::BTreeSet<String>", value = "enabled" },
  { name = "dev", ty = "&[std::path::PathBuf]", value = "dev" },
]

# The blood chest gets a block entity (API 15).
[[injection]]
id = "block-entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "entity" },
]

# ... and ticks on the server (API 15).
[[injection]]
id = "block-entity-ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "block_entity_ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "ticks" },
]

# Eleven slots — ten repair slots and the factor container slot (API 16/17).
[[injection]]
id = "block-entity-container"
hook = "block_entity_container"
hook_version = 1
kind = "HEAD"
helper = "block_entity_container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<horizon_client::containers::ModContainer>", value = "container" },
]

# One 10-bucket tank of `evilcraft:blood` (API 54), in the entity's saved `fluids`.
[[injection]]
id = "block-entity-fluids"
hook = "block_entity_fluids"
hook_version = 1
kind = "HEAD"
helper = "block_entity_fluids.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "fluids", ty = "&mut Option<horizon_client::containers::ModFluidTanks>", value = "fluids" },
]

# Each tick: empty a carried container into the tank, then repair a damage point
# every second tick (API 15).
[[injection]]
id = "block-entity-tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "block_entity_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "entity" },
]

# A carried Blood Extractor takes the blood of the player's last kill (API 39).
[[injection]]
id = "inventory-tick"
hook = "inventory_tick"
hook_version = 1
kind = "HEAD"
helper = "inventory_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "slot", ty = "i32", value = "slot" },
  { name = "selected", ty = "bool", value = "selected" },
]

# The kill itself (API 40): `floor(hp x 5) .. floor(hp x 40)` mB for the player's
# extractors.
[[injection]]
id = "mob-killed"
hook = "mob_killed"
hook_version = 1
kind = "HEAD"
helper = "mob_killed.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "entity", ty = "u32", value = "entity" },
]

# The chest's eleven-slot layout (API 19).
[[injection]]
id = "screen"
hook = "screen"
hook_version = 1
kind = "HEAD"
helper = "screen.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "screen", ty = "&mut Option<NativeScreen>", value = "screen" },
]

# ... and its tank readout (API 19).
[[injection]]
id = "screen-draw"
hook = "screen_draw"
hook_version = 1
kind = "HEAD"
helper = "screen_draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "data", ty = "&[i32]", value = "data" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "batch" },
  { name = "origin", ty = "[f32; 2]", value = "origin" },
]

# The extractor's own tooltip: "Blood: x/5000 mB" (API 12).
[[injection]]
id = "tooltip"
hook = "tooltip"
hook_version = 1
kind = "HEAD"
helper = "tooltip.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "lines", ty = "&mut Vec<(Text, u32)>", value = "lines" },
]

# `/evilcraft info|blood|damage|held` (API 8).
[[injection]]
id = "register-commands"
hook = "register_commands"
hook_version = 1
kind = "HEAD"
helper = "register_commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<NativeCommand>", value = "commands" },
]

[[injection]]
id = "perform-command"
hook = "perform_command"
hook_version = 1
kind = "HEAD"
helper = "perform_command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "ran" },
]
